<section class="admin-page page-admin-projects" aria-labelledby="admin-projects-heading" aria-busy="true">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 id="admin-projects-heading" class="h2 mb-0"><i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Admin · Projects</h1>
    <a class="btn btn-outline-secondary" href="/admin/users">Users</a>
    <form class="d-flex gap-2" role="search" data-search-form>
      <label class="visually-hidden" for="admin-project-search">Search projects by title</label>
      <input class="form-control" id="admin-project-search" name="q" type="search" maxlength="100" placeholder="Search by title" />
      <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>
  </div>

  <div data-state="loading" class="d-flex align-items-center gap-2 text-body-secondary" role="status">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span>Loading projects…</span>
  </div>

  <div data-state="error" class="alert alert-danger" role="alert" hidden>
    <p class="mb-2" data-error-text>Could not load projects.</p>
    <button type="button" class="btn btn-outline-danger btn-sm" data-retry>Try again</button>
  </div>

  <div data-state="empty" class="card" hidden>
    <div class="card-body text-center py-5 text-body-secondary" data-empty-text>No projects found.</div>
  </div>

  <div data-state="table" hidden>
    <div class="table-responsive">
      <table class="table table-hover align-middle admin-table">
        <caption class="visually-hidden">All projects</caption>
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Owner</th>
            <th scope="col" class="text-end">Stages</th>
            <th scope="col" class="text-end">Tasks</th>
            <th scope="col">Created</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody data-rows></tbody>
      </table>
    </div>
  </div>

  <nav class="d-flex flex-wrap justify-content-between align-items-center gap-2" aria-label="Projects pagination" data-pager hidden></nav>

  <template data-row-template>
    <tr>
      <th scope="row" class="fw-semibold" data-cell="title"></th>
      <td data-cell="owner"></td>
      <td class="text-end" data-cell="stages"></td>
      <td class="text-end" data-cell="tasks"></td>
      <td class="text-nowrap" data-cell="created"></td>
      <td class="text-nowrap">
        <a class="btn btn-sm btn-outline-primary" data-action="view">View</a>
        <a class="btn btn-sm btn-outline-secondary" data-action="edit">Edit</a>
        <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete">Delete</button>
      </td>
    </tr>
  </template>
</section>
