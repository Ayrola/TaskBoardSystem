<div class="modal fade add-stage-modal" tabindex="-1" aria-labelledby="add-stage-title">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="add-stage-title">Add Stage</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="add-stage-name" class="form-label">Stage name <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="add-stage-name" name="name" class="form-control" required maxlength="100" autocomplete="off" aria-describedby="add-stage-name-help add-stage-error">
          <div id="add-stage-name-help" class="form-text">Up to 100 characters. Each stage needs a unique name.</div>
        </div>
        <div class="form-check">
          <input id="add-stage-done" name="isDone" type="checkbox" class="form-check-input">
          <label for="add-stage-done" class="form-check-label">Tasks in this stage count as done</label>
        </div>
        <p class="text-danger mt-3 mb-0" id="add-stage-error" role="alert" data-error hidden></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" data-submit>Add Stage</button>
      </div>
    </form>
  </div>
</div>
