<div class="modal fade task-form-modal" tabindex="-1" aria-labelledby="task-form-title">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
    <form class="modal-content" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="task-form-title" data-modal-title></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger" role="alert" data-form-error hidden></div>

        <div class="mb-3">
          <label for="task-title" class="form-label">Title <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="task-title" name="title" type="text" class="form-control" required maxlength="200"
            autocomplete="off" aria-describedby="task-title-error" />
          <div id="task-title-error" class="invalid-feedback" data-error-for="title"></div>
        </div>

        <div class="mb-3">
          <label for="task-stage" class="form-label">Stage</label>
          <select id="task-stage" name="stage" class="form-select" aria-describedby="task-stage-error"></select>
          <div id="task-stage-error" class="invalid-feedback" data-error-for="stage"></div>
          <div class="form-text" data-stage-hint hidden>The task moves to the end of the chosen stage.</div>
        </div>

        <div class="mb-0">
          <span id="task-description-label" class="form-label d-block">Description <span class="text-body-secondary">(optional)</span></span>
          <div class="task-editor" data-editor-wrap>
            <div data-editor></div>
          </div>
          <div class="invalid-feedback d-block" data-error-for="description" id="task-description-error"></div>
          <div class="form-text">Bold, italic, underline, strikethrough, links, lists and quotes are supported.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-cancel>Cancel</button>
        <button type="submit" class="btn btn-primary" data-submit>
          <span class="spinner-border spinner-border-sm me-1" aria-hidden="true" data-spinner hidden></span>
          <span data-submit-label>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
