<div class="modal fade move-task-modal" tabindex="-1" aria-labelledby="move-task-title">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="move-task-title">Move task</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-break">Choose where to place <strong data-task-title></strong>.</p>
        <div class="mb-3">
          <label for="move-task-stage" class="form-label">Destination stage</label>
          <select id="move-task-stage" class="form-select" data-stage></select>
        </div>
        <div class="mb-0">
          <label for="move-task-position" class="form-label">Position in the stage</label>
          <select id="move-task-position" class="form-select" data-position></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-arrows-move" aria-hidden="true"></i> Move</button>
      </div>
    </form>
  </div>
</div>
